<!DOCTYPE html>
<meta charset="UTF-8">
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>GranuxGames | Login</title>
    
    <script src="/js/index/login/login.js"></script>

    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/index/login/general.css">
  </head>
  <body>
    <div id="form" class="login-form">
      <div id="input-fields">
        <div class="input-wrapper">
          <div class="icon-space"></div>
          <input id="input-username" type="text" placeholder="Username">
          <div class="icon-space"></div>
        </div>
        <div class="input-wrapper">
          <div class="icon-space"></div>
          <input id="input-password" type="password" placeholder="Password">
          <div class="icon-space"></div>
        </div>
      </div>
      <div id="line"></div>
      <div id="buttons">
        <button id="button-login">Login</button>
        <a id="href-register" href="/register">Register Instead</a>
      </div>
      <img id="cat" src="/resources/imgs/linos/login/cat.gif"></img>
      <p id="output"></p>
    </div>
  </body>
</html>
